<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>profiessional profile card</title>
    <link rel="stylesheet" href="style.css">
</head>
<style>
    body{
        font-family:Arial, Helvetica, sans-serif;
        background-color:#d1d5db ;
        margin:2;
        padding:70px;
    }
    profile-card{
        width:400px;
        margin:auto;
        padding:30px;
        background-color:aqua;
        border:1px solid #d1d5db;
        border-radius:15px;
        text-align:center; 
    }
    profile-image p{
        font-size:70px;
        margin-bottom:20px;
    }
    h1{
        color:#0000;
        font-size:30px;
        font-weight:800;
        margin-bottom:7px;
    }
    h3{
        color:#2563eb;
        font-size:20px;
        font-weight:500;
    }
    profile-card p{
        color:#555;
        font-size:15px;
        line-height:1.5;
    }
    details{
        text-align:left;
        background-color:#f8fa;
        padding:20px;
        margin-top:25px;
        border-radius:10px;
    }
    details p{
        font-size:15px;
        color:#333;
    }
</style>
<body>
    <center><div class="profile-card">
        <div class="profile-image">
    </div>
    <h1>details</h1>
    <h3>jahnavi</h3>
    <p>
        passionate about we b devolpment.
        UI design and create ing user-frinendly website.
    </p>
    <div class="details">
        <p><strong>name:jahnavi</strong></p>
        <p><strong>registration no:24V11A0559</strong></p>
        <p><strong>email:</strong>jahnavi@mail.com</p>
        <p><strong>skills:</strong>html,javasript,css,java,python</p>
        <p><strong>education:</strong>B.Tech,cse</p>
    </div>-96 
    </div>
    </center>
</body>
</html>
